;===================================================================
; openclash.ini —— 软路由 OpenClash 专用远程配置（精简 · 手动选节点 · 防泄露）
; 目标客户端: OpenClash / mihomo（target=clash）
; 仓库: utopia0051/my-sub-rules
;
; 为软路由性能优化的核心设计：
;   用 mihomo 的 geosite/geoip 数据库（geodata）替代大体量域名表
;   —— GEOSITE,geolocation-!cn 一条顶 Global 的 3.4 万条，内核二进制匹配、
;      inline 规则量从几万降到几百，软路由内存友好。
;   保留全部自维护精华小表（AI/金融/Emby/ACG/防泄露/个人规则），
;   砍掉的只是大社区镜像表（Global/China/AdvertisingLite/GlobalMedia），
;   用 geosite 等效替代，分流效果基本一致、负担骤降。
;
; 手动选节点：所有分组均为 select，无自动测速组，你自己在面板选。
; 节点分组正则同主配置（机场/自建），换机场改关键字记得两行都改。
;===================================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true

;基础模板：防 DNS 泄露（fake-ip + DoH）+ sniffer + geodata 源（与主配置共用）
clash_rule_base=https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/base/clash_base.yml

;------------------------- 分组定义（全部 select 手动选）-------------------------
;总开关：机场↔自建一键切换，也可直接选单个节点（末尾 .* 展开全部节点）；放最上面方便切换，下面服务组默认跟随
custom_proxy_group=🔀机场or单个切换`select`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=✈️ 机场订阅`select`(机场订阅|IEPL|实验性|高级|标准)
custom_proxy_group=🚀 遵纪守法小组`select`(^(?!.*(机场订阅|IEPL|实验性|高级|标准)).*)
custom_proxy_group=🌍 国外网站`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=🤖 AI 服务`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=🍎 Apple`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*`[]DIRECT
custom_proxy_group=📺 流媒体`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=📲 Telegram`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=🔒 隐私防护`select`[]REJECT`[]✈️ 机场订阅`[]🚀 遵纪守法小组`[]DIRECT
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]✈️ 机场订阅`[]🚀 遵纪守法小组
custom_proxy_group=🐟 漏网之鱼`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*`[]DIRECT
;全局模式专用：Clash 切到「全局」模式时走这个 GLOBAL 组，已展开全部节点，可直接选任意单节点（规则模式下它不参与分流）
custom_proxy_group=GLOBAL`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*`[]DIRECT

;------------------------- 分流规则（顺序即优先级）-------------------------
;1. 局域网（geosite 原生）
ruleset=🎯 全球直连,[]GEOSITE,private

;2. 个人自定义（小表，优先级最高）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/custom-direct.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/custom-proxy.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/custom-reject.list
ruleset=🎯 全球直连,[]DST-PORT,123

;3. 防泄露（核心，完整保留）——STUN 端口内联 + 域名表 + HttpDNS 拦截
ruleset=🔒 隐私防护,[]DST-PORT,3478
ruleset=🔒 隐私防护,[]DST-PORT,5349
ruleset=🔒 隐私防护,[]DST-PORT,19302
ruleset=🔒 隐私防护,[]DST-PORT,19303
ruleset=🔒 隐私防护,[]DST-PORT,19304
ruleset=🔒 隐私防护,[]DST-PORT,19305
ruleset=🔒 隐私防护,[]DST-PORT,19306
ruleset=🔒 隐私防护,[]DST-PORT,19307
ruleset=🔒 隐私防护,[]DST-PORT,19308
ruleset=🔒 隐私防护,[]DST-PORT,19309
ruleset=🔒 隐私防护,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/stun.list
ruleset=🔒 隐私防护,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/BlockHttpDNS.list

;4. AI（自维护小表 + geosite 聚合 AI 兜底）
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/claude-code.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/chatgpt.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/ai-misc.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/AI-VPSDance.list
ruleset=🤖 AI 服务,[]GEOSITE,category-ai-!cn

;5. 金融（自维护小表）
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/finance-proxy.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/finance-direct.list
;   Apple 分区敏感服务（App Store/Apple ID/iCloud）走 🍎 Apple 组（美区 ID）
ruleset=🍎 Apple,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/apple-proxy.list

;6. Emby / 二次元 / 泄露检测站（自维护小表）
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/emby.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/acg.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/leak-test.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/docker.list

;7. 流媒体（geosite 原生大类）
ruleset=📺 流媒体,[]GEOSITE,youtube
ruleset=📺 流媒体,[]GEOSITE,netflix
ruleset=📺 流媒体,[]GEOSITE,disney
ruleset=📺 流媒体,[]GEOSITE,bahamut

;8. Telegram（geosite + geoip 原生）
ruleset=📲 Telegram,[]GEOSITE,telegram
ruleset=📲 Telegram,[]GEOIP,telegram

;9. 广告拦截（geosite 原生大类，不占 inline）
ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all

;10. 国外网站（geosite 一条顶 Global 3.4 万条）
ruleset=🌍 国外网站,[]GEOSITE,geolocation-!cn

;11. 国内直连（geosite + geoip 原生）
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn

;12. 兜底
ruleset=🐟 漏网之鱼,[]FINAL
