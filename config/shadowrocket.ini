ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/PrivateTracker.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/RemoteDesktop.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/SteamCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/RustDesk.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/CFnat.list

;3. WebRTC/STUN 防泄露（端口规则必须内联，Surge RULE-SET 会丢弃它们）
;   iOS 上 SR 全局隧道，UDP 天然走隧道，这些 REJECT 规则直接生效，无需额外开关
ruleset=🔒 隐私防护,[]DST-PORT,3478
ruleset=🔒 隐私防护,[]DST-PORT,5349
ruleset=🔒 隐私防护,[]DST-PORT,19302
