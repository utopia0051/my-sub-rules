;===================================================================
; shadowrocket.ini —— Shadowrocket 专用远程配置（防泄露）
;
; ⚠️ 转换目标：在 sub-web-modify 前端选 【Surge (ver 4)】。
;    老版 subconverter 后端不支持 target=shadowrocket（会 400），
;    而 Shadowrocket 原生兼容 Surge 配置格式，用 Surge 目标最稳。
;
; 节点分组沿用 Clash 版同一套正则（机场/自建），规则源同为本仓库 rules/mirror/ 镜像。
; 与 Clash 版的差别：STUN 端口规则必须内联（Surge 的 RULE-SET 不接受端口规则），
; 已在下方 [隐私防护] 段直接列出，不会像 RULE-SET 那样被转换丢弃。
;===================================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true

;Shadowrocket 基础模板（DoH 防泄露、关 IPv6）
surge_rule_base=https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/base/shadowrocket.conf

;------------------------- 分组定义 -------------------------
;总开关：机场↔自建一键切换，也可直接选单个节点（末尾 .* 展开全部节点）；放最上面方便切换，下面服务组默认跟随
custom_proxy_group=🔀机场or单个切换`select`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=✈️ 机场订阅`select`(机场订阅|IEPL|实验性|高级|标准)
custom_proxy_group=🚀 遵纪守法小组`select`(^(?!.*(机场订阅|IEPL|实验性|高级|标准)).*)
custom_proxy_group=🌍 国外网站`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=🤖 AI 服务`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=🍎 Apple`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*`[]DIRECT
custom_proxy_group=📺 流媒体`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=📲 Telegram`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*
custom_proxy_group=🔒 隐私防护`select`[]REJECT`[]✈️ 机场订阅`[]🚀 遵纪守法小组`[]DIRECT
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]✈️ 机场订阅`[]🚀 遵纪守法小组
custom_proxy_group=🐟 漏网之鱼`select`[]🔀机场or单个切换`[]✈️ 机场订阅`[]🚀 遵纪守法小组`.*`[]DIRECT

;------------------------- 分流规则（顺序即优先级） -------------------------
;1. 局域网
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/Lan.list

;2. 个人自定义规则（域名类经 RULE-SET 转换生效；端口类见第 3 段内联）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/custom-direct.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/finance-direct.list
;   Apple 分区敏感服务（App Store/Apple ID/iCloud）走 🍎 Apple 组（美区 ID）
ruleset=🍎 Apple,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/apple-proxy.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/custom-proxy.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/leak-test.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/docker.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/acg.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/finance-proxy.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/emby.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/custom-reject.list
;   NTP 直连（端口规则，内联；对应 custom-direct.list 里的 DST-PORT,123）
ruleset=🎯 全球直连,[]DST-PORT,123

;2.5 特殊直连（镜像自 LM-Firefly/Rules）：BT/PT 下载工具防走代理、NTP 时间同步、TeamViewer
