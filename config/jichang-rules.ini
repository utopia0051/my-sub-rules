;===================================================================
; jichang-rules.ini —— 仅机场订阅远程配置（无自建节点组）
; 目标客户端: Clash / mihomo（转换时使用 target=clash）
; 规则源: 本仓库 rules/mirror/ 镜像（上游 blackmatrix7，来源见 MANIFEST）
; 仓库: utopia0051/my-sub-rules
;
; 节点分组机制：
;   ✈️ 机场订阅   = 节点名含 机场订阅/IEPL/实验性/高级/标准 关键字
;   只转换一个来源时，直接把所有节点归入 ✈️ 机场订阅 组。
;   ⚠️ 换机场后若节点名关键字变了，下面这行的关键字要同步改
;===================================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true
;显式控制分组在客户端的显示顺序（从前往后），✈️ 机场订阅 始终在最上
proxy_group_order=✈️ 机场订阅,🌍 国外网站,🤖 AI 服务,🍎 Apple,📺 流媒体,📲 Telegram,🛑 广告拦截,🔒 隐私防护,🐟 漏网之鱼,🎯 全球直连,GLOBAL

;基础模板：防 DNS 泄露的 dns 配置、sniffer、TUN 参数
clash_rule_base=https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/base/clash_base.yml

;------------------------- 分组定义 -------------------------
;唯一节点来源组：所有机场节点
custom_proxy_group=✈️ 机场订阅`select`.*
;服务组全部直接指向 ✈️ 机场订阅（不展开单节点、无总开关）
custom_proxy_group=🌍 国外网站`select`[]✈️ 机场订阅`.*
custom_proxy_group=🤖 AI 服务`select`[]✈️ 机场订阅`.*
custom_proxy_group=🍎 Apple`select`[]✈️ 机场订阅`.*`[]DIRECT
custom_proxy_group=📺 流媒体`select`[]✈️ 机场订阅`.*
custom_proxy_group=📲 Telegram`select`[]✈️ 机场订阅`.*
custom_proxy_group=🔒 隐私防护`select`[]REJECT`[]✈️ 机场订阅`[]DIRECT
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]✈️ 机场订阅
custom_proxy_group=🐟 漏网之鱼`select`[]✈️ 机场订阅`.*`[]DIRECT
;全局模式专用：Clash 切到「全局」模式时走这个 GLOBAL 组，已展开全部节点（规则模式下不参与分流）
custom_proxy_group=GLOBAL`select`[]✈️ 机场订阅`.*`[]DIRECT

;------------------------- 分流规则（顺序即优先级） -------------------------
;1. 局域网
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/Lan.list

;2. 个人自定义规则（优先级最高）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/custom-direct.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/finance-direct.list
;   Apple 分区敏感服务（App Store/Apple ID/iCloud）走 🍎 Apple 组（美区 ID）
ruleset=🍎 Apple,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/apple-proxy.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/custom-proxy.list
