;===================================================================
; basic.ini —— 精简版远程配置（对标旧 Basic/basic.ini 的极简结构）
; 与旧版一致：单一 🚀 遵纪守法小组 含全部节点（机场+自建混在一起），
; 规则直接落到 DIRECT，不设多余策略组，轻量、通用、适合多客户端。
; 与旧版不同：规则源换成在线活源；同样挂防泄露 base 模板和 STUN 拦截。
; 需要机场/自建分组显示请用完整版 config/sub-rules.ini。
;===================================================================

[custom]
enable_rule_generator=true
overwrite_original_rules=true
;显式控制分组在客户端的显示顺序（从前往后），🚀 遵纪守法小组 始终在最上
proxy_group_order=🚀 遵纪守法小组,🔒 隐私防护,GLOBAL

;基础模板：防 DNS 泄露（与完整版共用同一个）
clash_rule_base=https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/base/clash_base.yml

;------------------------- 分组 -------------------------
custom_proxy_group=🚀 遵纪守法小组`select`.*
custom_proxy_group=🔒 隐私防护`select`[]REJECT`[]🚀 遵纪守法小组`[]DIRECT
;全局模式专用：Clash 切到「全局」模式时走这个 GLOBAL 组（规则模式下它不参与分流）。
;⚠️ 必须把所有分组显式列进来：安卓 CMFA 的分组列表只列 GLOBAL 成员里属于「组」的项
;（core/.../tunnel/proxies.go QueryProxyGroupNames），漏写的组在安卓端不可见。
custom_proxy_group=GLOBAL`select`[]🚀 遵纪守法小组`[]🔒 隐私防护`.*`[]DIRECT

;------------------------- 规则 -------------------------
;局域网 + 个人直连
ruleset=DIRECT,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/Lan.list
ruleset=DIRECT,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/custom-direct.list
ruleset=DIRECT,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/finance-direct.list
;   抖音客户端/直播直连（自维护 58 条）：必须排在 GlobalMedia(snssdk.com) 之前，
;   否则直播 API 与弹幕被流媒体组抢去代理，规则模式下看直播卡顿。
;   本配置不引用任何广告表，故无需像其他配置那样排在广告段之后。
;   另有 13 条 geosite:cn 也缺的字节系域名在 custom-direct.list，两表互斥合计 71 条。
ruleset=DIRECT,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/douyin-live.list
ruleset=🚀 遵纪守法小组,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/apple-proxy.list
;个人强制代理
