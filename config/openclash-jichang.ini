ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/Grok.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/AppleAI.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/OpenAI.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/Claude.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/Gemini.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/mirror/Copilot.list
ruleset=🤖 AI 服务,[]GEOSITE,category-ai-!cn

;5. 金融（自维护小表）
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/finance-proxy.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/finance-direct.list
;   Apple 分区敏感服务（App Store/Apple ID/iCloud）走 🍎 Apple 组（美区 ID）
ruleset=🍎 Apple,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/apple-proxy.list

;6. Emby / 二次元 / 泄露检测站（自维护小表）
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/emby.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/acg.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/leak-test.list
ruleset=🌍 国外网站,https://raw.githubusercontent.com/utopia0051/my-sub-rules/main/rules/docker.list

;7. 流媒体（geosite 原生大类）
ruleset=📺 流媒体,[]GEOSITE,youtube
ruleset=📺 流媒体,[]GEOSITE,netflix
ruleset=📺 流媒体,[]GEOSITE,disney
ruleset=📺 流媒体,[]GEOSITE,bahamut

;8. Telegram（geosite + geoip 原生）
ruleset=📲 Telegram,[]GEOSITE,telegram
ruleset=📲 Telegram,[]GEOIP,telegram,no-resolve

;9. 广告拦截（geosite 原生大类，不占 inline）
ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all

;10. 国外网站（geosite 一条顶 Global 3.4 万条）
ruleset=🌍 国外网站,[]GEOSITE,geolocation-!cn

;11. 国内直连（geosite + geoip 原生）
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

;12. 兜底
ruleset=🐟 漏网之鱼,[]FINAL
