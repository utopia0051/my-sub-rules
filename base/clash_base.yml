# ===================================================================
# clash_base.yml —— Clash/mihomo 基础模板（由 subconverter 注入节点与规则）
# 重点：防 DNS 泄露的 dns 配置 + 域名嗅探 + TUN 参数
# ===================================================================

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
# 关闭 IPv6 可显著减小泄露面（家宽 v6 直连绕过代理是常见泄露源）
# 如你的节点与网络对 v6 支持良好，可自行改为 true
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geo-auto-update: true
geo-update-interval: 168
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  # asn 必须显式写出：规则集含 11 条 IP-ASN（AI-VPSDance/Copilot/OpenAI/Telegram），
  # 内核启动即需 ASN 库；缺此键会回落到 GitHub releases 直连，国内 TLS 超时且此时
  # 代理未起、无法自救，整份配置测试失败。
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

# 域名嗅探：fake-ip 模式下提高按域名分流的准确性
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.push.apple.com"

# ---------------- DNS：防泄露核心 ----------------
# 设计要点：
# 1. fake-ip 模式：走代理的域名在本地拿到假 IP，真实解析在落地节点完成，
#    国外域名的 DNS 请求根本不出本机 —— 这是防 DNS 泄露的第一道闸。
# 2. 所有本地解析（国内域名、节点服务器域名）全部走加密 DoH，
#    运营商无法看到明文 DNS。
# 3. 刻意【不】把 stun 域名加入 fake-ip-filter —— 很多模板把 stun 放行，
#    这正是 WebRTC 泄露真实 IP 的常见根源。
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 精选合并自 HenryChiao/MIHOMO_YAMLS 的 fake-ip-filter，并做了一处关键取舍：
  # ⚠️ 刻意剔除了原列表中的 .stun.*.* 和 +.turn.twilio.com——把 STUN/TURN 放进
  # fake-ip-filter（返回真实 IP）正是 WebRTC 泄露的常见根源，我们靠 🔒 隐私防护
  # 分组拦截 STUN，不在 DNS 层放行。
  # ⚠️ 不要加 "*" 通配符——它匹配所有域名，会让境外域名跳过 fake-ip 直接走
  # default-nameserver（国内 DNS），完全绕过 nameserver-policy 的 geosite 分流，
  # 境外 DNS 查询直接落到国内 DNS 上，是 DNS 泄露的根源。
  fake-ip-filter:
    # 保留域 / 局域网 / 本机
    - "+.bogon"
    - "+.direct"
    - "+.example"
    - "+.home.arpa"
    - "+.internal"
    - "+.invalid"
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.localhost"
    - "+.m2m"
    - "+.test"
    - "+.ts.net"
    - "+.3gppnetwork.org"
    # 开发 / DDNS / 泛域名解析服务
    - "+.docker.io"
    - "+.proxy.golang.org"
    - "+.dynv6.net"
    - "+.nip.io"
    - "+.sslip.io"
    - "+.oray.com"
    - "+.orayimg.com"
    # 路由器 / 设备面板
    - "+.router.asus.com"
    - "+.linksys.com"
    - "+.linksyssmartwifi.com"
    - "+.miwifi.com"
    - "+.market.xiaomi.com"
    - "heartbeat.belkin.com"
    - "local.adguard.org"
    # NTP / 时间同步
    - "+.ntp.org.cn"
    - "+.pool.ntp.org"
    - "+.time.edu.cn"
    - "ntp.*.com"
    - "ntp1.*.com"
    - "ntp2.*.com"
    - "ntp3.*.com"
    - "ntp4.*.com"
    - "ntp5.*.com"
    - "ntp6.*.com"
    - "ntp7.*.com"
    - "time.*.com"
    - "time.*.apple.com"
    - "time.*.edu.cn"
    - "time.*.gov"
    - "time1.*.com"
    - "time2.*.com"
    - "time3.*.com"
    - "time4.*.com"
    - "time5.*.com"
    - "time6.*.com"
    - "time7.*.com"
    - "time-ios.apple.com"
    - "time-macos.apple.com"
    - "time1.cloud.tencent.com"
    # 网络连通性检测
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    # 苹果推送与系统更新
    - "+.push.apple.com"
    - "mesu.apple.com"
    - "swcdn.apple.com"
    - "swdist.apple.com"
    - "swdownload.apple.com"
    - "swquery.apple.com"
    - "swscan.apple.com"
    # 游戏平台（联机 NAT / 下载 CDN）
    - "*.*.xboxlive.com"
    - "xbox.*.microsoft.com"
    - "xbox.*.*.microsoft.com"
    - "xnotify.xboxlive.com"
    - "+.battle.net"
    - "+.battlenet.com.cn"
    - "+.cdn.nintendo.net"
    - "+.srv.nintendo.net"
    - "+.square-enix.com"
    - "+.steamcontent.com"
    - "+.wargaming.net"
    - "+.wggames.cn"
    - "+.wotgame.cn"
    - "+.wowsgame.cn"
    - "+.ffxiv.com"
    - "+.finalfantasyxiv.com"
    - "+.ff14.sdo.com"
    - "ff.dorado.sdo.com"
    - "+.gcloudcs.com"
    - "+.gcloudsdk.com"
    - "ps.res.netease.com"
    - "na.b.g-tun.com"
    - "+.kk-rays.com"
    - "+.n0808.com"
    # 国内服务（网易 / 招行 / 迅雷 / 在线音乐）
    - "+.126.net"
    - "+.cmbchina.com"
    - "+.cmbimg.com"
    - "+.sandai.net"
    - "+.kuwo.cn"
    - "+.music.163.com"
    - "+.music.migu.cn"
    - "+.xiami.com"
    - "+.y.qq.com"
    - "amobile.music.tc.qq.com"
    - "aqqmusic.tc.qq.com"
    - "dl.stream.qqmusic.qq.com"
    - "isure.stream.qqmusic.qq.com"
    - "mobileoc.music.tc.qq.com"
    - "streamoc.music.tc.qq.com"
    - "songsearch.kugou.com"
    - "trackercdn.kugou.com"
    - "music.taihe.com"
    - "musicapi.taihe.com"
    - "joox.com"
    - "api.joox.com"
    - "api-jooxtt.sanook.com"
    # 微信 / QQ 登录回环
    - "localhost.*.weixin.qq.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    # 广告过滤器自身与杂项
    - "adguardteam.github.io"
    - "adrules.top"
    - "anti-ad.net"
    - "static.adtidy.org"
    - "shark007.net"
    - "lens.l.google.com"
  # 引导 DNS（仅用于解析下面 DoH 服务器自身的域名，纯 IP 无需引导时保留兜底）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # ⚠️ 兜底解析器【必须】是境外 DoH。geosite:cn 与 geolocation-!cn 都是有限清单，
  # 之间有大片双不命中的灰区（实测 leak-test.list 31 个域名里 23 个落灰区：
  # dnsleaktest.com / ping0.cc / browserscan.net / ipinfo.io / ifconfig.me …）。
  # 兜底若为国内 DoH，这些域名就落到阿里/腾讯 DNS —— 这正是"规则模式泄露、
  # 全局模式正常"的根因：全局模式不做规则匹配，全部 fake-ip 交落地节点解析。
  # 配合 respect-rules: true，这两个 DoH 自身的查询也经代理发出。
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  # 节点域名专用，必须国内 DoH 直连，否则解析节点要先连节点 —— 死循环
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
  # DNS 查询遵循分流规则出站（境外 DoH 经代理，国内 DoH 直连）
  respect-rules: true
  nameserver-policy:
    # ⚠️ 顺序即优先级（dns/resolver.go matchPolicy 顺序遍历、首个命中即 return）。
    # 这两条【必须】在 geosite:private,cn 之前 —— 它们被 geosite:cn 收录（实测在
    # cn 清单 111873 条里），放后面会被国内 DoH 抢先命中，泄露检测站自己走国内 DNS。
    # 刻意不用 YAML anchor 去重：本文件要经 subconverter(yaml-cpp) 反序列化再 emit，
    # anchor 的 round-trip 行为随版本而异，为省两行引入不可验证的中间层不值当。
    "+.browserleaks.com":
      - "https://1.1.1.1/dns-query"
      - "https://8.8.8.8/dns-query"
    "+.whatismyip.com":
      - "https://1.1.1.1/dns-query"
      - "https://8.8.8.8/dns-query"
    # 国内与内网域名走国内 DoH（白名单式收窄，其余一律兜底到境外 DoH）
    "geosite:private,cn":
      - "https://223.5.5.5/dns-query"
      - "https://doh.pub/dns-query"

# ---------------- TUN：接管全部流量（含 UDP）----------------
# WebRTC/STUN 是 UDP 流量，仅开"系统代理"根本管不到它，必须开 TUN。
# 桌面客户端（Clash Verge Rev / mihomo party 等）一般在界面上有 TUN 开关，
# 开启后即使用下方参数；命令行用户把 enable 改为 true。
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
